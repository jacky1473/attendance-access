# easyWDMS Attendance Dashboard Nginx Reverse Proxy Config
# Copy this file to /etc/nginx/default.d/easywdms.conf (CentOS/RHEL)
# or include it inside your server block in /etc/nginx/sites-available/ (Ubuntu/Debian)

location = /attendance {
    return 301 /attendance/;
}

location /attendance/ {
    proxy_pass http://127.0.0.1:8083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /attendance;
    proxy_read_timeout 180s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
}
